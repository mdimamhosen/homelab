title: My Homelab
subtitle: Self-hosted services
logo: https://raw.githubusercontent.com/bastienwirtz/homer/main/public/logo.png
theme: default
footer: ""
columns: 3
links:
  - name: Documentation
    icon: fas fa-book
    url: https://docs.portainer.io/
    target: _blank
  - name: Support Forum
    icon: fas fa-comments
    url: https://community.nextcloud.com/
